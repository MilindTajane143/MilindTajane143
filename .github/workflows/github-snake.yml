name: Generate Snake Animation

on:
  schedule:
    - cron: "0 1 * * *"   # Daily at 01:00 UTC (after stats update)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake (Light theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MilindTajane143
          outputs: dist/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake (Pink/Purple dark theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MilindTajane143
          outputs: dist/github-contribution-grid-snake-pink.svg?color_snake=#ff4da6&color_dots=#170e28,#3d1a5e,#bf5af2,#ff4da6,#ffffff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
